# YT Контрол за iPhone/iPad – проект за XcodeGen.
# На Mac:  brew install xcodegen  &&  cd yt-control/ios  &&  xcodegen  &&  open YTKontrol.xcodeproj
name: YTKontrol
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # избери екипа си в Xcode → Signing & Capabilities (или впиши Team ID тук)
    SWIFT_VERSION: "5.0"
targets:
  YTKontrol:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    scheme: {}                    # споделена схема – нужна за xcodebuild archive в облака
    sources:
      - path: YTKontrol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biocode.ytkontrol
        PRODUCT_NAME: YTKontrol
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: YTKontrol/Info.plist
      properties:
        CFBundleDisplayName: "YT Контрол"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.biocode.ytkontrol
            CFBundleURLSchemes: [ytkontrol]
